<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">VideoPoet 多模态自回归生成</title><desc id="desc">视频与音频分别通过 MAGVIT-v2 和 SoundStream 编码，配合文本和任务条件进行自回归 token 预测，然后解码成视频与音频。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#95707a"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#51474b;font-size:16px}.small{font-size:14px;fill:#756b70}.label{font-size:13px;letter-spacing:2px;fill:#946875}.box{fill:#f8f1f2;stroke:#dbc7cd;stroke-width:1.5}.blue{fill:#eef4f6;stroke:#c7d8dd;stroke-width:1.5}.flow{fill:none;stroke:#95707a;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="800" height="460" fill="#fff"/><text x="30" y="34" class="label">VIDEOPOET · 多模态条件 → TOKEN 序列</text>
<rect class="box" x="30" y="64" width="220" height="78" rx="12"/><text x="140" y="94" text-anchor="middle">图像 / 视频条件</text><text x="140" y="120" text-anchor="middle" class="small">MAGVIT-v2 → 离散视觉码</text>
<rect class="box" x="290" y="64" width="220" height="78" rx="12"/><text x="400" y="94" text-anchor="middle">音频条件</text><text x="400" y="120" text-anchor="middle" class="small">SoundStream → 离散音频码</text>
<rect class="box" x="550" y="64" width="220" height="78" rx="12"/><text x="660" y="94" text-anchor="middle">文本条件 / 任务信息</text><text x="660" y="120" text-anchor="middle" class="small">与模态序列共同组织输入</text>
<path class="flow" d="M140 142V175H340V204"/><path class="flow" d="M400 142V204"/><path class="flow" d="M660 142V175H460V204"/>
<rect class="blue" x="240" y="206" width="320" height="80" rx="12"/><text x="400" y="236" text-anchor="middle">Decoder-only Transformer</text><text x="400" y="263" text-anchor="middle" class="small">条件 + 已有序列 → 下一个 token</text>
<path class="flow" d="M560 246H605V184H490V204"/><text x="615" y="220" class="small">追加并继续</text>
<path class="flow" d="M340 286V318H210V342"/><path class="flow" d="M460 286V318H590V342"/>
<rect class="box" x="65" y="344" width="290" height="64" rx="12"/><text x="210" y="371" text-anchor="middle">视觉码 → 视觉解码器</text><text x="210" y="394" text-anchor="middle" class="small">恢复视频像素</text>
<rect class="box" x="445" y="344" width="290" height="64" rx="12"/><text x="590" y="371" text-anchor="middle">音频码 → 音频解码器</text><text x="590" y="394" text-anchor="middle" class="small">恢复声音波形</text>
<text x="30" y="441" class="small">输入与输出按任务选择；并非每个任务都同时生成视频与声音。</text>
</svg>
