<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$description$" />
  <title>$title$ — Huiqing Zhang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="article.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html#top" class="nav-brand">Huiqing&nbsp;Zhang</a>
      <ul class="nav-links">
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#publications">Publications</a></li>
        <li><a href="../cv.html">CV</a></li>
        <li><a href="index.html" class="active">Blog</a></li>
      </ul>
    </div>
  </nav>

  <main class="article-shell">
    <a href="index.html" class="back-link">← 返回全部文章</a>
    <header class="article-header">
      <p class="article-kicker">$if(category)$$category$$else$RESEARCH NOTES$endif$</p>
      <h1>$title$</h1>
      <time class="article-date" datetime="$date-iso$">$date$</time>
      <p class="article-deck">$description$</p>
    </header>

    <section class="article-gallery" aria-label="演讲笔记图集">
      <div class="gallery-strip" id="articleGallery">
        <button class="gallery-slide" type="button" data-index="0"><img src="../assets/images/blog/robust-geometry/01-cover.png" alt="演讲笔记封面" /></button>
        <button class="gallery-slide" type="button" data-index="1"><img src="../assets/images/blog/robust-geometry/02-problem-framing.png" alt="问题立论" /></button>
        <button class="gallery-slide" type="button" data-index="2"><img src="../assets/images/blog/robust-geometry/03-paradigm-comparison.png" alt="重建范式比较" /></button>
        <button class="gallery-slide" type="button" data-index="3"><img src="../assets/images/blog/robust-geometry/04-visual-ambiguity.png" alt="视觉歧义" /></button>
        <button class="gallery-slide" type="button" data-index="4"><img src="../assets/images/blog/robust-geometry/05-long-tail.png" alt="长尾分布" /></button>
        <button class="gallery-slide" type="button" data-index="5"><img src="../assets/images/blog/robust-geometry/06-long-tail-simulation.png" alt="长尾模拟" /></button>
        <button class="gallery-slide" type="button" data-index="6"><img src="../assets/images/blog/robust-geometry/07-metric-scale.png" alt="物理尺度恢复" /></button>
        <button class="gallery-slide" type="button" data-index="7"><img src="../assets/images/blog/robust-geometry/08-reflection.png" alt="方法论反思" /></button>
      </div>
      <p class="gallery-help">滑动浏览 · 点击图片放大</p>
    </section>

    <div class="article-layout">
      <aside class="article-sidebar" aria-label="文章目录">
        <p class="article-sidebar-label">CONTENTS</p>
        $if(toc)$
        $table-of-contents$
        $endif$
      </aside>
      <article class="article-content">
$body$
      </article>
    </div>
  </main>

  <div class="article-lightbox" id="articleLightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="article-lightbox-backdrop" type="button" data-close aria-label="关闭预览"></button>
    <div class="article-lightbox-panel">
      <button class="article-lightbox-close" type="button" data-close aria-label="关闭">×</button>
      <button class="article-lightbox-nav article-lightbox-prev" type="button" data-prev aria-label="上一张">‹</button>
      <img id="articleLightboxImage" src="" alt="" />
      <button class="article-lightbox-nav article-lightbox-next" type="button" data-next aria-label="下一张">›</button>
      <p id="articleLightboxCount" class="article-lightbox-count"></p>
    </div>
  </div>

  <footer class="footer"><p>© <span id="year"></span> Huiqing Zhang.</p></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="article-gallery.js"></script>
</body>
</html>
