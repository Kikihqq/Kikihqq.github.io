<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-labelledby="title desc">
<title id="title">Transformer 的三种注意力</title><desc id="desc">按 Vaswani 等（2017）图 1 重绘 · 编码器和解码器各堆叠 N 层</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#667589"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#f5f7fb"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#1f3045">
<text x="26" y="42" font-size="27" font-weight="700">Transformer 的三种注意力</text>
<text x="26" y="70" font-size="18" font-weight="650">编码源句</text>
<rect x="26" y="83" width="198" height="58" rx="9" fill="#e0eef7" stroke="#c5ceda"/>
<text x="125" y="106" text-anchor="middle" font-size="17" font-weight="650">源 token</text>
<text x="125" y="127" text-anchor="middle" font-size="14" fill="#394d64">嵌入 + 位置编码</text>
<path d="M224 112H246" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="251" y="83" width="198" height="58" rx="9" fill="#e0eef7" stroke="#c5ceda"/>
<text x="350" y="106" text-anchor="middle" font-size="17" font-weight="650">双向自注意力</text>
<text x="350" y="127" text-anchor="middle" font-size="14" fill="#394d64">Q、K、V 来自源序列</text>
<path d="M449 112H471" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="476" y="83" width="198" height="58" rx="9" fill="#e0eef7" stroke="#c5ceda"/>
<text x="575" y="106" text-anchor="middle" font-size="17" font-weight="650">逐位置 FFN</text>
<text x="575" y="127" text-anchor="middle" font-size="14" fill="#394d64">逐 token 变换通道</text>
<path d="M674 112H696" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="701" y="83" width="198" height="58" rx="9" fill="#e0eef7" stroke="#c5ceda"/>
<text x="800" y="106" text-anchor="middle" font-size="17" font-weight="650">编码器输出</text>
<text x="800" y="127" text-anchor="middle" font-size="14" fill="#394d64">作为交叉注意力的 K、V</text>
<path d="M800 141V153H575V180" fill="none" stroke="#667589" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="26" y="170" font-size="18" font-weight="650">解码目标句</text>
<rect x="26" y="183" width="198" height="58" rx="9" fill="#f3e4ec" stroke="#c5ceda"/>
<text x="125" y="206" text-anchor="middle" font-size="17" font-weight="650">右移目标 token</text>
<text x="125" y="227" text-anchor="middle" font-size="14" fill="#394d64">嵌入 + 位置编码</text>
<path d="M224 212H246" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="251" y="183" width="198" height="58" rx="9" fill="#f3e4ec" stroke="#c5ceda"/>
<text x="350" y="206" text-anchor="middle" font-size="17" font-weight="650">因果自注意力</text>
<text x="350" y="227" text-anchor="middle" font-size="14" fill="#394d64">保留当前位置及之前</text>
<path d="M449 212H471" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="476" y="183" width="198" height="58" rx="9" fill="#f3e4ec" stroke="#c5ceda"/>
<text x="575" y="206" text-anchor="middle" font-size="17" font-weight="650">交叉注意力 → FFN</text>
<text x="575" y="227" text-anchor="middle" font-size="14" fill="#394d64">Q 读取编码器输出</text>
<path d="M674 212H696" stroke="#667589" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="701" y="183" width="198" height="58" rx="9" fill="#f3e4ec" stroke="#c5ceda"/>
<text x="800" y="206" text-anchor="middle" font-size="17" font-weight="650">线性层 → softmax</text>
<text x="800" y="227" text-anchor="middle" font-size="14" fill="#394d64">预测下一个目标 token</text>
<text x="26" y="285" font-size="15" fill="#394d64">按 Vaswani 等（2017）图 1 重绘 · 编码器和解码器各堆叠 N 层</text>
</g></svg>
