<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">V-JEPA 2：先学习表示，再接入动作与规划</title><desc id="desc">预训练上下文编码器只看到可见块，目标编码器看到完整视频，以 EMA 更新且停止梯度。预测器比较遮挡位置的目标特征。后训练冻结视觉编码器，结合机器人状态和动作预测未来特征，用目标图像进行闭环规划。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#95707a"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#51474b;font-size:16px}.small{font-size:14px;fill:#756b70}.label{font-size:13px;letter-spacing:2px;fill:#946875}.box{fill:#f8f1f2;stroke:#dbc7cd;stroke-width:1.5}.blue{fill:#eef4f6;stroke:#c7d8dd;stroke-width:1.5}.flow{fill:none;stroke:#95707a;stroke-width:1.8;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}</style>
<rect width="800" height="650" fill="#fff"/><text x="30" y="34" class="label">V-JEPA 2 / 2-AC · 2025 · 两阶段结构示意</text>
<text x="30" y="72">A · 无动作预训练：预测遮挡区域的表示</text>
<rect class="box" x="30" y="98" width="150" height="60" rx="10"/><text x="105" y="134" text-anchor="middle">可见视频块</text>
<rect class="box" x="220" y="98" width="170" height="60" rx="10"/><text x="305" y="123" text-anchor="middle">上下文编码器</text><text x="305" y="146" text-anchor="middle" class="small">可训练参数 θ</text>
<rect class="blue" x="435" y="98" width="155" height="60" rx="10"/><text x="512" y="123" text-anchor="middle">预测器</text><text x="512" y="146" text-anchor="middle" class="small">+ 目标位置标记</text>
<rect class="box" x="635" y="98" width="135" height="60" rx="10"/><text x="702" y="134" text-anchor="middle">预测特征</text>
<path class="flow" d="M180 128H218"/><path class="flow" d="M390 128H433"/><path class="flow" d="M590 128H633"/>
<rect class="box" x="30" y="239" width="150" height="60" rx="10"/><text x="105" y="275" text-anchor="middle">完整视频</text>
<rect class="box" x="220" y="239" width="170" height="60" rx="10"/><text x="305" y="264" text-anchor="middle">目标编码器</text><text x="305" y="287" text-anchor="middle" class="small">EMA 参数 θ̄</text>
<rect class="box" x="435" y="239" width="155" height="60" rx="10"/><text x="512" y="264" text-anchor="middle">目标特征</text><text x="512" y="287" text-anchor="middle" class="small">停止梯度</text>
<rect class="blue" x="635" y="239" width="135" height="60" rx="10"/><text x="702" y="264" text-anchor="middle">特征损失</text><text x="702" y="287" text-anchor="middle" class="small">匹配遮挡位置</text>
<path class="flow" d="M180 269H218"/><path class="flow" d="M390 269H433"/><path class="flow" d="M590 269H633"/><path class="flow" d="M702 158V237"/>
<path class="flow dash" d="M305 158V237"/><text x="320" y="201" class="small">EMA 更新，非梯度回传</text>
<path d="M30 330H770" stroke="#eadde0"/>
<text x="30" y="368">B · 2-AC 后训练与部署：引入机器人交互数据</text>
<rect class="box" x="30" y="399" width="200" height="68" rx="10"/><text x="130" y="426" text-anchor="middle">观测 → 冻结编码器</text><text x="130" y="451" text-anchor="middle" class="small">视觉状态特征</text>
<rect class="blue" x="290" y="399" width="220" height="68" rx="10"/><text x="400" y="426" text-anchor="middle">动作条件预测器</text><text x="400" y="451" text-anchor="middle" class="small">滚动预测未来特征</text>
<rect class="box" x="570" y="399" width="200" height="68" rx="10"/><text x="670" y="426" text-anchor="middle">规划器</text><text x="670" y="451" text-anchor="middle" class="small">与目标图像特征比较</text>
<path class="flow" d="M230 433H288"/><path class="flow" d="M510 433H568"/>
<rect class="box" x="290" y="509" width="220" height="54" rx="10"/><text x="400" y="541" text-anchor="middle">机器人状态 + 候选动作</text><path class="flow" d="M400 509V469"/>
<path class="flow" d="M670 467V597H130V469"/><text x="450" y="622" text-anchor="middle" class="small">部署：执行首个动作 → 新观测 → 重新规划</text>
</svg>
